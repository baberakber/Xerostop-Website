<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-labelledby="title desc">
  <title id="title">The agentic AIOps loop</title>
  <desc id="desc">A continuous five-step loop: observe, correlate, diagnose, act and learn, with a human approval gate before the act step.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1f3a"/>
      <stop offset="1" stop-color="#07111f"/>
    </linearGradient>
    <radialGradient id="hubGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#42a5f5" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#1e88e5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nodeGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#1e88e5" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#1e88e5" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1d3354" stroke-width="1" stroke-opacity="0.45"/>
    </pattern>
  </defs>

  <rect width="1200" height="600" fill="url(#bg)"/>
  <rect width="1200" height="600" fill="url(#grid)"/>

  <!-- Loop ring -->
  <circle cx="330" cy="320" r="190" fill="none" stroke="#1e88e5" stroke-opacity="0.55" stroke-width="2" stroke-dasharray="6 8"/>

  <!-- Direction arrows (clockwise) -->
  <g fill="#42a5f5">
    <path d="M-8-7L8 0-8 7Z" transform="translate(441.7 166.3) rotate(36)"/>
    <path d="M-8-7L8 0-8 7Z" transform="translate(510.7 378.7) rotate(108)"/>
    <path d="M-8-7L8 0-8 7Z" transform="translate(149.3 378.7) rotate(252)"/>
    <path d="M-8-7L8 0-8 7Z" transform="translate(218.3 166.3) rotate(324)"/>
  </g>

  <!-- Central hub -->
  <circle cx="330" cy="320" r="110" fill="url(#hubGlow)"/>
  <circle cx="330" cy="320" r="68" fill="#1e88e5" fill-opacity="0.2" stroke="#42a5f5" stroke-opacity="0.8" stroke-width="2"/>

  <g font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" text-anchor="middle">
    <text x="330" y="316" font-size="18" font-weight="700" fill="#f1f5fb">AI agent</text>
    <text x="330" y="338" font-size="13" fill="#bbdefb">+ your team</text>

    <!-- Nodes -->
    <g>
      <circle cx="330" cy="130" r="70" fill="url(#nodeGlow)"/>
      <circle cx="330" cy="130" r="50" fill="#132b4f" stroke="#42a5f5" stroke-width="2"/>
      <text x="330" y="122" font-size="12" font-weight="700" fill="#42a5f5">01</text>
      <text x="330" y="143" font-size="16" font-weight="700" fill="#f1f5fb">Observe</text>
    </g>
    <g>
      <circle cx="510.7" cy="261.3" r="70" fill="url(#nodeGlow)"/>
      <circle cx="510.7" cy="261.3" r="50" fill="#132b4f" stroke="#42a5f5" stroke-width="2"/>
      <text x="510.7" y="253.3" font-size="12" font-weight="700" fill="#42a5f5">02</text>
      <text x="510.7" y="274.3" font-size="16" font-weight="700" fill="#f1f5fb">Correlate</text>
    </g>
    <g>
      <circle cx="441.7" cy="473.7" r="70" fill="url(#nodeGlow)"/>
      <circle cx="441.7" cy="473.7" r="50" fill="#132b4f" stroke="#42a5f5" stroke-width="2"/>
      <text x="441.7" y="465.7" font-size="12" font-weight="700" fill="#42a5f5">03</text>
      <text x="441.7" y="486.7" font-size="16" font-weight="700" fill="#f1f5fb">Diagnose</text>
    </g>
    <g>
      <circle cx="218.3" cy="473.7" r="70" fill="url(#nodeGlow)"/>
      <circle cx="218.3" cy="473.7" r="50" fill="#132b4f" stroke="#42a5f5" stroke-width="2"/>
      <text x="218.3" y="465.7" font-size="12" font-weight="700" fill="#42a5f5">04</text>
      <text x="218.3" y="486.7" font-size="16" font-weight="700" fill="#f1f5fb">Act</text>
    </g>
    <g>
      <circle cx="149.3" cy="261.3" r="70" fill="url(#nodeGlow)"/>
      <circle cx="149.3" cy="261.3" r="50" fill="#132b4f" stroke="#42a5f5" stroke-width="2"/>
      <text x="149.3" y="253.3" font-size="12" font-weight="700" fill="#42a5f5">05</text>
      <text x="149.3" y="274.3" font-size="16" font-weight="700" fill="#f1f5fb">Learn</text>
    </g>

    <!-- Human approval gate between Diagnose and Act -->
    <rect x="262" y="530" width="136" height="32" rx="16" fill="#0b1f3a" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="330" y="551" font-size="13" font-weight="700" fill="#67e8f9">Human approval</text>
    <path d="M330 510v18" stroke="#22d3ee" stroke-width="1.5" stroke-dasharray="3 3"/>
  </g>

  <!-- Legend -->
  <g font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif">
    <text x="660" y="92" font-size="26" font-weight="700" fill="#f1f5fb">The agentic AIOps loop</text>
    <text x="660" y="122" font-size="15" fill="#a9b8cc">From noisy alerts to verified action, continuously</text>

    <g>
      <circle cx="676" cy="176" r="16" fill="#1e88e5"/>
      <text x="676" y="181" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">1</text>
      <text x="708" y="172" font-size="17" font-weight="700" fill="#f1f5fb">Observe</text>
      <text x="708" y="195" font-size="14" fill="#a9b8cc">Collect logs, metrics, traces and events via OpenTelemetry</text>
    </g>
    <g>
      <circle cx="676" cy="252" r="16" fill="#1e88e5"/>
      <text x="676" y="257" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">2</text>
      <text x="708" y="248" font-size="17" font-weight="700" fill="#f1f5fb">Correlate</text>
      <text x="708" y="271" font-size="14" fill="#a9b8cc">Group related alerts using topology, timing and recent changes</text>
    </g>
    <g>
      <circle cx="676" cy="328" r="16" fill="#1e88e5"/>
      <text x="676" y="333" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">3</text>
      <text x="708" y="324" font-size="17" font-weight="700" fill="#f1f5fb">Diagnose</text>
      <text x="708" y="347" font-size="14" fill="#a9b8cc">The agent investigates and ranks likely root causes with evidence</text>
    </g>
    <g>
      <circle cx="676" cy="404" r="16" fill="#1e88e5"/>
      <text x="676" y="409" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">4</text>
      <text x="708" y="400" font-size="17" font-weight="700" fill="#f1f5fb">Act</text>
      <text x="708" y="423" font-size="14" fill="#a9b8cc">Run an approved runbook: restart, scale, fail over or roll back</text>
    </g>
    <g>
      <circle cx="676" cy="480" r="16" fill="#1e88e5"/>
      <text x="676" y="485" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">5</text>
      <text x="708" y="476" font-size="17" font-weight="700" fill="#f1f5fb">Learn</text>
      <text x="708" y="499" font-size="14" fill="#a9b8cc">Update runbooks, alert rules and models after every incident</text>
    </g>

    <rect x="660" y="530" width="136" height="32" rx="16" fill="#0b1f3a" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="728" y="551" text-anchor="middle" font-size="13" font-weight="700" fill="#67e8f9">Human approval</text>
    <text x="812" y="551" font-size="14" fill="#a9b8cc">Required until a use case earns autonomy</text>
  </g>
</svg>
