<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-labelledby="title desc">
  <title id="title">Cisco Catalyst SD-WAN architecture</title>
  <desc id="desc">SD-WAN Manager, Controller and Validator form the management, control and orchestration planes. WAN Edge routers form the data plane and build encrypted tunnels over MPLS, internet and LTE or 5G transports.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1f3a"/>
      <stop offset="1" stop-color="#07111f"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#15294a"/>
      <stop offset="1" stop-color="#0f2240"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1d3354" stroke-width="1" stroke-opacity="0.45"/>
    </pattern>
  </defs>

  <rect width="1200" height="640" fill="url(#bg)"/>
  <rect width="1200" height="640" fill="url(#grid)"/>

  <!-- Connectors -->
  <g fill="none" stroke="#42a5f5" stroke-width="2" stroke-dasharray="5 6" stroke-opacity="0.85">
    <path d="M280 250V320"/>
    <path d="M600 250V320"/>
    <path d="M920 250V320"/>
  </g>
  <g fill="none" stroke="#4ade80" stroke-width="2" stroke-opacity="0.75">
    <path d="M180 470V420"/>
    <path d="M460 470V420"/>
    <path d="M740 470V420"/>
    <path d="M1020 470V420"/>
  </g>

  <g font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif">
    <text x="600" y="56" text-anchor="middle" font-size="26" font-weight="700" fill="#f1f5fb">Cisco Catalyst SD-WAN architecture</text>
    <text x="600" y="88" text-anchor="middle" font-size="15" fill="#a9b8cc">Four planes, each handled by a dedicated component</text>

    <!-- Control components -->
    <g>
      <rect x="150" y="122" width="260" height="128" rx="14" fill="url(#card)" stroke="#42a5f5" stroke-opacity="0.8"/>
      <text x="280" y="150" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="1.5" fill="#42a5f5">MANAGEMENT PLANE</text>
      <text x="280" y="178" text-anchor="middle" font-size="18" font-weight="700" fill="#f1f5fb">SD-WAN Manager</text>
      <text x="280" y="198" text-anchor="middle" font-size="12" fill="#7f90a8">formerly vManage</text>
      <text x="280" y="226" text-anchor="middle" font-size="13" fill="#a9b8cc">Configuration, monitoring, Day 0-2</text>

      <rect x="470" y="122" width="260" height="128" rx="14" fill="url(#card)" stroke="#42a5f5" stroke-opacity="0.8"/>
      <text x="600" y="150" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="1.5" fill="#42a5f5">CONTROL PLANE</text>
      <text x="600" y="178" text-anchor="middle" font-size="18" font-weight="700" fill="#f1f5fb">SD-WAN Controller</text>
      <text x="600" y="198" text-anchor="middle" font-size="12" fill="#7f90a8">formerly vSmart</text>
      <text x="600" y="226" text-anchor="middle" font-size="13" fill="#a9b8cc">OMP routes, policy and keys</text>

      <rect x="790" y="122" width="260" height="128" rx="14" fill="url(#card)" stroke="#42a5f5" stroke-opacity="0.8"/>
      <text x="920" y="150" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="1.5" fill="#42a5f5">ORCHESTRATION PLANE</text>
      <text x="920" y="178" text-anchor="middle" font-size="18" font-weight="700" fill="#f1f5fb">SD-WAN Validator</text>
      <text x="920" y="198" text-anchor="middle" font-size="12" fill="#7f90a8">formerly vBond</text>
      <text x="920" y="226" text-anchor="middle" font-size="13" fill="#a9b8cc">Device authentication, NAT traversal</text>
    </g>

    <!-- Transport band -->
    <rect x="60" y="320" width="1080" height="100" rx="16" fill="#1e88e5" fill-opacity="0.08" stroke="#42a5f5" stroke-opacity="0.5" stroke-dasharray="2 0"/>
    <text x="84" y="346" font-size="11" font-weight="700" letter-spacing="1.5" fill="#42a5f5">TRANSPORT: ENCRYPTED IPSEC TUNNELS OVER ANY WAN</text>
    <g>
      <rect x="170" y="358" width="220" height="48" rx="24" fill="#0b1f3a" stroke="#1e88e5"/>
      <text x="280" y="380" text-anchor="middle" font-size="15" font-weight="700" fill="#f1f5fb">MPLS</text>
      <text x="280" y="397" text-anchor="middle" font-size="11" fill="#a9b8cc">private color</text>

      <rect x="490" y="358" width="220" height="48" rx="24" fill="#0b1f3a" stroke="#1e88e5"/>
      <text x="600" y="380" text-anchor="middle" font-size="15" font-weight="700" fill="#f1f5fb">Internet</text>
      <text x="600" y="397" text-anchor="middle" font-size="11" fill="#a9b8cc">public color</text>

      <rect x="810" y="358" width="220" height="48" rx="24" fill="#0b1f3a" stroke="#1e88e5"/>
      <text x="920" y="380" text-anchor="middle" font-size="15" font-weight="700" fill="#f1f5fb">LTE / 5G</text>
      <text x="920" y="397" text-anchor="middle" font-size="11" fill="#a9b8cc">public color</text>
    </g>

    <!-- Data plane -->
    <text x="600" y="458" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="1.5" fill="#4ade80">DATA PLANE: WAN EDGE ROUTERS</text>
    <g>
      <rect x="60" y="470" width="240" height="96" rx="14" fill="url(#card)" stroke="#4ade80" stroke-opacity="0.7"/>
      <text x="180" y="504" text-anchor="middle" font-size="17" font-weight="700" fill="#f1f5fb">Branch</text>
      <text x="180" y="528" text-anchor="middle" font-size="13" fill="#a9b8cc">Catalyst 8200 / 8300</text>
      <text x="180" y="548" text-anchor="middle" font-size="12" fill="#7f90a8">replaces vEdge 100/1000/2000</text>

      <rect x="340" y="470" width="240" height="96" rx="14" fill="url(#card)" stroke="#4ade80" stroke-opacity="0.7"/>
      <text x="460" y="504" text-anchor="middle" font-size="17" font-weight="700" fill="#f1f5fb">Regional hub</text>
      <text x="460" y="528" text-anchor="middle" font-size="13" fill="#a9b8cc">Catalyst 8300 / 8500</text>
      <text x="460" y="548" text-anchor="middle" font-size="12" fill="#7f90a8">regional breakout, services</text>

      <rect x="620" y="470" width="240" height="96" rx="14" fill="url(#card)" stroke="#4ade80" stroke-opacity="0.7"/>
      <text x="740" y="504" text-anchor="middle" font-size="17" font-weight="700" fill="#f1f5fb">Data center</text>
      <text x="740" y="528" text-anchor="middle" font-size="13" fill="#a9b8cc">Catalyst 8500</text>
      <text x="740" y="548" text-anchor="middle" font-size="12" fill="#7f90a8">aggregation and transit</text>

      <rect x="900" y="470" width="240" height="96" rx="14" fill="url(#card)" stroke="#4ade80" stroke-opacity="0.7"/>
      <text x="1020" y="504" text-anchor="middle" font-size="17" font-weight="700" fill="#f1f5fb">Cloud</text>
      <text x="1020" y="528" text-anchor="middle" font-size="13" fill="#a9b8cc">Catalyst 8000V</text>
      <text x="1020" y="548" text-anchor="middle" font-size="12" fill="#7f90a8">replaces vEdge Cloud</text>
    </g>

    <!-- Legend -->
    <g font-size="13" fill="#a9b8cc">
      <path d="M390 608H430" stroke="#42a5f5" stroke-width="2" stroke-dasharray="5 6"/>
      <text x="440" y="613">Control connections (DTLS/TLS)</text>
      <path d="M680 608H720" stroke="#4ade80" stroke-width="2"/>
      <text x="730" y="613">Data plane (IPsec)</text>
    </g>
  </g>
</svg>
