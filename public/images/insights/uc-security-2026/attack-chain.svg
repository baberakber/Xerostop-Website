<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="1200" height="540" role="img" aria-labelledby="title desc">
  <title id="title">Help-desk impersonation: the 2026 attack chain</title>
  <desc id="desc">Five stages: external chat, vishing call, remote access, credential theft and data exfiltration, each paired with the control that breaks it.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1f3a"/>
      <stop offset="1" stop-color="#07111f"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#15294a"/>
      <stop offset="1" stop-color="#0f2240"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#1e88e5" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#1e88e5" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1d3354" stroke-width="1" stroke-opacity="0.45"/>
    </pattern>
  </defs>

  <rect width="1200" height="540" fill="url(#bg)"/>
  <rect width="1200" height="540" fill="url(#grid)"/>

  <g font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif">
    <text x="600" y="62" text-anchor="middle" font-size="26" font-weight="700" fill="#f1f5fb">Help-desk impersonation: the 2026 attack chain</text>
    <text x="600" y="94" text-anchor="middle" font-size="15" fill="#a9b8cc">How a single external Teams chat becomes an enterprise-wide breach</text>

    <!-- Step 1 -->
    <g>
      <rect x="30" y="140" width="196" height="260" rx="16" fill="url(#card)" stroke="#1e88e5" stroke-opacity="0.45"/>
      <circle cx="58" cy="168" r="14" fill="#1e88e5"/>
      <text x="58" y="173" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">1</text>
      <circle cx="128" cy="225" r="46" fill="url(#glow)"/>
      <circle cx="128" cy="225" r="34" fill="#1e88e5" fill-opacity="0.12" stroke="#42a5f5" stroke-opacity="0.5"/>
      <g transform="translate(110 207) scale(1.5)" fill="none" stroke="#42a5f5" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
        <path d="M8 10h.01M12 10h.01M16 10h.01"/>
      </g>
      <text x="128" y="292" text-anchor="middle" font-size="18" font-weight="700" fill="#f1f5fb">External chat</text>
      <text x="128" y="320" text-anchor="middle" font-size="14" fill="#a9b8cc">A fake "IT Support"</text>
      <text x="128" y="342" text-anchor="middle" font-size="14" fill="#a9b8cc">tenant messages an</text>
      <text x="128" y="364" text-anchor="middle" font-size="14" fill="#a9b8cc">employee on Teams</text>
    </g>

    <!-- Step 2 -->
    <g>
      <rect x="266" y="140" width="196" height="260" rx="16" fill="url(#card)" stroke="#1e88e5" stroke-opacity="0.45"/>
      <circle cx="294" cy="168" r="14" fill="#1e88e5"/>
      <text x="294" y="173" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">2</text>
      <circle cx="364" cy="225" r="46" fill="url(#glow)"/>
      <circle cx="364" cy="225" r="34" fill="#1e88e5" fill-opacity="0.12" stroke="#42a5f5" stroke-opacity="0.5"/>
      <g transform="translate(346 207) scale(1.5)" fill="none" stroke="#42a5f5" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
      </g>
      <text x="364" y="292" text-anchor="middle" font-size="18" font-weight="700" fill="#f1f5fb">Vishing call</text>
      <text x="364" y="320" text-anchor="middle" font-size="14" fill="#a9b8cc">The caller creates</text>
      <text x="364" y="342" text-anchor="middle" font-size="14" fill="#a9b8cc">urgency and talks the</text>
      <text x="364" y="364" text-anchor="middle" font-size="14" fill="#a9b8cc">victim through steps</text>
    </g>

    <!-- Step 3 -->
    <g>
      <rect x="502" y="140" width="196" height="260" rx="16" fill="url(#card)" stroke="#1e88e5" stroke-opacity="0.45"/>
      <circle cx="530" cy="168" r="14" fill="#1e88e5"/>
      <text x="530" y="173" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">3</text>
      <circle cx="600" cy="225" r="46" fill="url(#glow)"/>
      <circle cx="600" cy="225" r="34" fill="#1e88e5" fill-opacity="0.12" stroke="#42a5f5" stroke-opacity="0.5"/>
      <g transform="translate(582 207) scale(1.5)" fill="none" stroke="#42a5f5" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="3" width="20" height="14" rx="2"/>
        <path d="M8 21h8M12 17v4"/>
        <path d="M9 10l2 2 4-4"/>
      </g>
      <text x="600" y="292" text-anchor="middle" font-size="18" font-weight="700" fill="#f1f5fb">Remote access</text>
      <text x="600" y="320" text-anchor="middle" font-size="14" fill="#a9b8cc">Victim launches</text>
      <text x="600" y="342" text-anchor="middle" font-size="14" fill="#a9b8cc">Quick Assist or an</text>
      <text x="600" y="364" text-anchor="middle" font-size="14" fill="#a9b8cc">RMM tool</text>
    </g>

    <!-- Step 4 -->
    <g>
      <rect x="738" y="140" width="196" height="260" rx="16" fill="url(#card)" stroke="#1e88e5" stroke-opacity="0.45"/>
      <circle cx="766" cy="168" r="14" fill="#1e88e5"/>
      <text x="766" y="173" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">4</text>
      <circle cx="836" cy="225" r="46" fill="url(#glow)"/>
      <circle cx="836" cy="225" r="34" fill="#1e88e5" fill-opacity="0.12" stroke="#42a5f5" stroke-opacity="0.5"/>
      <g transform="translate(818 207) scale(1.5)" fill="none" stroke="#42a5f5" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="7.5" cy="15.5" r="5.5"/>
        <path d="m21 2-9.6 9.6"/>
        <path d="m15.5 7.5 3 3L22 7l-3-3"/>
      </g>
      <text x="836" y="292" text-anchor="middle" font-size="18" font-weight="700" fill="#f1f5fb">Credential theft</text>
      <text x="836" y="320" text-anchor="middle" font-size="14" fill="#a9b8cc">Tokens and passwords</text>
      <text x="836" y="342" text-anchor="middle" font-size="14" fill="#a9b8cc">are harvested for</text>
      <text x="836" y="364" text-anchor="middle" font-size="14" fill="#a9b8cc">lateral movement</text>
    </g>

    <!-- Step 5 -->
    <g>
      <rect x="974" y="140" width="196" height="260" rx="16" fill="url(#card)" stroke="#42a5f5" stroke-opacity="0.8"/>
      <circle cx="1002" cy="168" r="14" fill="#1e88e5"/>
      <text x="1002" y="173" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">5</text>
      <circle cx="1072" cy="225" r="46" fill="url(#glow)"/>
      <circle cx="1072" cy="225" r="34" fill="#1e88e5" fill-opacity="0.12" stroke="#42a5f5" stroke-opacity="0.5"/>
      <g transform="translate(1054 207) scale(1.5)" fill="none" stroke="#42a5f5" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
        <path d="M17 8l-5-5-5 5"/>
        <path d="M12 3v12"/>
      </g>
      <text x="1072" y="292" text-anchor="middle" font-size="18" font-weight="700" fill="#f1f5fb">Data exfiltration</text>
      <text x="1072" y="320" text-anchor="middle" font-size="14" fill="#a9b8cc">Sensitive data is</text>
      <text x="1072" y="342" text-anchor="middle" font-size="14" fill="#a9b8cc">staged and copied</text>
      <text x="1072" y="364" text-anchor="middle" font-size="14" fill="#a9b8cc">to attacker storage</text>
    </g>

    <!-- Arrows between steps -->
    <g fill="none" stroke="#42a5f5" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M234 270h24M250 262l8 8-8 8"/>
      <path d="M470 270h24M486 262l8 8-8 8"/>
      <path d="M706 270h24M722 262l8 8-8 8"/>
      <path d="M942 270h24M958 262l8 8-8 8"/>
    </g>

    <!-- Controls that break each step -->
    <text x="30" y="428" font-size="11" font-weight="700" letter-spacing="1.5" fill="#42a5f5">BREAK THE CHAIN</text>
    <g font-size="13" font-weight="600" fill="#bbdefb" text-anchor="middle">
      <rect x="38" y="440" width="180" height="34" rx="17" fill="#1e88e5" fill-opacity="0.15" stroke="#1e88e5" stroke-opacity="0.7"/>
      <text x="128" y="462">Domain allowlist</text>
      <rect x="274" y="440" width="180" height="34" rx="17" fill="#1e88e5" fill-opacity="0.15" stroke="#1e88e5" stroke-opacity="0.7"/>
      <text x="364" y="462">Help-desk verification</text>
      <rect x="510" y="440" width="180" height="34" rx="17" fill="#1e88e5" fill-opacity="0.15" stroke="#1e88e5" stroke-opacity="0.7"/>
      <text x="600" y="462">Block unapproved RMM</text>
      <rect x="746" y="440" width="180" height="34" rx="17" fill="#1e88e5" fill-opacity="0.15" stroke="#1e88e5" stroke-opacity="0.7"/>
      <text x="836" y="462">Phishing-resistant MFA</text>
      <rect x="982" y="440" width="180" height="34" rx="17" fill="#1e88e5" fill-opacity="0.15" stroke="#1e88e5" stroke-opacity="0.7"/>
      <text x="1072" y="462">SIEM detection</text>
    </g>

    <text x="600" y="512" text-anchor="middle" font-size="14" fill="#7f90a8">Every step abuses a legitimate feature. Stopping any one of them breaks the attack.</text>
  </g>
</svg>
