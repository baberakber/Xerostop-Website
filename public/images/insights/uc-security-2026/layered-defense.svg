<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-labelledby="title desc">
  <title id="title">Layered UC defense model</title>
  <desc id="desc">Six concentric layers protecting unified communications: identity, endpoints, meeting controls, network and SIP edge, data and AI governance, and monitoring and response.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1f3a"/>
      <stop offset="1" stop-color="#07111f"/>
    </linearGradient>
    <radialGradient id="coreGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#42a5f5" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#1e88e5" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1d3354" stroke-width="1" stroke-opacity="0.45"/>
    </pattern>
  </defs>

  <rect width="1200" height="640" fill="url(#bg)"/>
  <rect width="1200" height="640" fill="url(#grid)"/>

  <!-- Concentric layers -->
  <g stroke="#42a5f5" stroke-opacity="0.45" stroke-width="1.5">
    <circle cx="330" cy="330" r="270" fill="#1e88e5" fill-opacity="0.06"/>
    <circle cx="330" cy="330" r="225" fill="#1e88e5" fill-opacity="0.08"/>
    <circle cx="330" cy="330" r="180" fill="#1e88e5" fill-opacity="0.11"/>
    <circle cx="330" cy="330" r="135" fill="#1e88e5" fill-opacity="0.15"/>
    <circle cx="330" cy="330" r="90" fill="#1e88e5" fill-opacity="0.22"/>
  </g>
  <circle cx="330" cy="330" r="80" fill="url(#coreGlow)"/>
  <circle cx="330" cy="330" r="48" fill="#1e88e5" stroke="#90caf9" stroke-width="2"/>

  <g font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif" text-anchor="middle" font-weight="700" letter-spacing="1.2">
    <text x="330" y="87" font-size="13" fill="#90caf9">MONITORING &amp; RESPONSE</text>
    <text x="330" y="132" font-size="13" fill="#90caf9">DATA &amp; AI GOVERNANCE</text>
    <text x="330" y="177" font-size="13" fill="#90caf9">NETWORK &amp; SIP EDGE</text>
    <text x="330" y="222" font-size="12" fill="#bbdefb">MEETING CONTROLS</text>
    <text x="330" y="266" font-size="12" fill="#e3f2fd">ENDPOINTS</text>
    <text x="330" y="335" font-size="13" fill="#ffffff">IDENTITY</text>
  </g>

  <!-- Legend -->
  <g font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif">
    <text x="680" y="88" font-size="26" font-weight="700" fill="#f1f5fb">Layered UC defense model</text>
    <text x="680" y="118" font-size="15" fill="#a9b8cc">Each layer limits the damage if the one before it fails</text>

    <g>
      <circle cx="696" cy="171" r="16" fill="#1e88e5"/>
      <text x="696" y="176" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">1</text>
      <text x="728" y="167" font-size="17" font-weight="700" fill="#f1f5fb">Identity</text>
      <text x="728" y="190" font-size="14" fill="#a9b8cc">Phishing-resistant MFA, Conditional Access, guest controls</text>
    </g>
    <g>
      <circle cx="696" cy="249" r="16" fill="#1e88e5" fill-opacity="0.8"/>
      <text x="696" y="254" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">2</text>
      <text x="728" y="245" font-size="17" font-weight="700" fill="#f1f5fb">Endpoints</text>
      <text x="728" y="268" font-size="14" fill="#a9b8cc">Managed devices, RMM allowlist, patched room systems</text>
    </g>
    <g>
      <circle cx="696" cy="327" r="16" fill="#1e88e5" fill-opacity="0.65"/>
      <text x="696" y="332" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">3</text>
      <text x="728" y="323" font-size="17" font-weight="700" fill="#f1f5fb">Meeting controls</text>
      <text x="728" y="346" font-size="14" fill="#a9b8cc">Lobby, verified join, sensitivity labels, E2EE, watermarking</text>
    </g>
    <g>
      <circle cx="696" cy="405" r="16" fill="#1e88e5" fill-opacity="0.5"/>
      <text x="696" y="410" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">4</text>
      <text x="728" y="401" font-size="17" font-weight="700" fill="#f1f5fb">Network &amp; SIP edge</text>
      <text x="728" y="424" font-size="14" fill="#a9b8cc">SBCs, TLS 1.3 and SRTP, segmentation, toll-fraud limits</text>
    </g>
    <g>
      <circle cx="696" cy="483" r="16" fill="#1e88e5" fill-opacity="0.38"/>
      <text x="696" y="488" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">5</text>
      <text x="728" y="479" font-size="17" font-weight="700" fill="#f1f5fb">Data &amp; AI governance</text>
      <text x="728" y="502" font-size="14" fill="#a9b8cc">Approved notetakers, retention, consent, legal hold</text>
    </g>
    <g>
      <circle cx="696" cy="561" r="16" fill="#1e88e5" fill-opacity="0.28" stroke="#42a5f5" stroke-opacity="0.6"/>
      <text x="696" y="566" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">6</text>
      <text x="728" y="557" font-size="17" font-weight="700" fill="#f1f5fb">Monitoring &amp; response</text>
      <text x="728" y="580" font-size="14" fill="#a9b8cc">Safe Links, ZAP, SIEM detections, rehearsed playbooks</text>
    </g>
  </g>
</svg>
