<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" role="img" aria-labelledby="title desc">
  <title id="title">Layered DDoS defense for a data center</title>
  <desc id="desc">Attack and legitimate traffic pass through four layers. Cloud scrubbing absorbs volumetric floods larger than your transit links. Upstream providers drop or rate-limit traffic with remotely triggered black hole routing and BGP Flowspec. The data center edge handles SYN floods, state exhaustion and application-layer floods. Control plane policing protects the CPU of every router and switch. Only clean traffic reaches the applications.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1f3a"/>
      <stop offset="1" stop-color="#07111f"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#15294a"/>
      <stop offset="1" stop-color="#0f2240"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f87171"/>
      <stop offset="0.45" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#4ade80"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1d3354" stroke-width="1" stroke-opacity="0.45"/>
    </pattern>
  </defs>

  <rect width="1200" height="620" fill="url(#bg)"/>
  <rect width="1200" height="620" fill="url(#grid)"/>

  <!-- Traffic band -->
  <polygon points="50,126 1150,146 1150,156 50,176" fill="url(#flow)" fill-opacity="0.85"/>

  <g font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif">
    <text x="600" y="56" text-anchor="middle" font-size="26" font-weight="700" fill="#f1f5fb">Layered DDoS defense</text>
    <text x="600" y="88" text-anchor="middle" font-size="15" fill="#a9b8cc">Stop each attack class at the layer that has the capacity to absorb it</text>

    <text x="50" y="116" font-size="12" font-weight="700" fill="#fca5a5">Attack and legitimate traffic</text>
    <text x="1150" y="136" text-anchor="end" font-size="12" font-weight="700" fill="#86efac">Clean traffic to applications</text>

    <!-- Panels -->
    <g stroke="#42a5f5" stroke-opacity="0.55">
      <rect x="50" y="196" width="260" height="316" rx="16" fill="url(#card)"/>
      <rect x="330" y="196" width="260" height="316" rx="16" fill="url(#card)"/>
      <rect x="610" y="196" width="260" height="316" rx="16" fill="url(#card)"/>
      <rect x="890" y="196" width="260" height="316" rx="16" fill="url(#card)"/>
    </g>

    <!-- Badges -->
    <g fill="#1e88e5" fill-opacity="0.18" stroke="#42a5f5">
      <circle cx="88" cy="234" r="16"/>
      <circle cx="368" cy="234" r="16"/>
      <circle cx="648" cy="234" r="16"/>
      <circle cx="928" cy="234" r="16"/>
    </g>
    <g font-size="15" font-weight="700" fill="#f1f5fb" text-anchor="middle">
      <text x="88" y="239">1</text>
      <text x="368" y="239">2</text>
      <text x="648" y="239">3</text>
      <text x="928" y="239">4</text>
    </g>

    <g>
      <text x="114" y="232" font-size="17" font-weight="700" fill="#f1f5fb">Cloud scrubbing</text>
      <text x="114" y="250" font-size="12" fill="#a9b8cc">Provider or CDN scrubbing</text>
      <text x="394" y="232" font-size="17" font-weight="700" fill="#f1f5fb">Upstream edge</text>
      <text x="394" y="250" font-size="12" fill="#a9b8cc">Your transit providers</text>
      <text x="674" y="232" font-size="17" font-weight="700" fill="#f1f5fb">Data center edge</text>
      <text x="674" y="250" font-size="12" fill="#a9b8cc">Routers, firewalls, ADCs</text>
      <text x="954" y="232" font-size="17" font-weight="700" fill="#f1f5fb">Control plane</text>
      <text x="954" y="250" font-size="12" fill="#a9b8cc">Every router and switch</text>
    </g>

    <g font-size="11" font-weight="700" letter-spacing="1.5" fill="#42a5f5">
      <text x="74" y="296">STOPS</text>
      <text x="354" y="296">STOPS</text>
      <text x="634" y="296">STOPS</text>
      <text x="914" y="296">STOPS</text>
      <text x="74" y="396">KEY TOOLS</text>
      <text x="354" y="396">KEY TOOLS</text>
      <text x="634" y="396">KEY TOOLS</text>
      <text x="914" y="396">KEY TOOLS</text>
    </g>

    <g font-size="14" fill="#a9b8cc">
      <text x="74" y="320">Volumetric floods far</text>
      <text x="74" y="340">larger than your transit</text>
      <text x="74" y="360">links (Tbps scale)</text>
      <text x="354" y="320">Floods aimed at a single</text>
      <text x="354" y="340">prefix or with a known</text>
      <text x="354" y="360">signature</text>
      <text x="634" y="320">SYN floods, session-table</text>
      <text x="634" y="340">exhaustion and HTTP</text>
      <text x="634" y="360">floods</text>
      <text x="914" y="320">Traffic aimed at the</text>
      <text x="914" y="340">device CPU itself</text>

      <text x="74" y="420">Always-on or on-demand</text>
      <text x="74" y="440">BGP diversion</text>
      <text x="74" y="460">Clean return over GRE</text>
      <text x="74" y="480">or a direct interconnect</text>
      <text x="354" y="420">RTBH, community</text>
      <text x="354" y="440">65535:666 (RFC 7999)</text>
      <text x="354" y="460">BGP Flowspec</text>
      <text x="354" y="480">(RFC 8955)</text>
      <text x="634" y="420">Infrastructure ACLs, uRPF</text>
      <text x="634" y="440">SYN cookies, conn limits</text>
      <text x="634" y="460">WAF and bot controls</text>
      <text x="914" y="420">Control plane policing</text>
      <text x="914" y="440">(CoPP) per protocol</text>
      <text x="914" y="460">Management-plane ACLs</text>
    </g>

    <!-- Note -->
    <rect x="200" y="540" width="800" height="32" rx="16" fill="#07111f" stroke="#4ade80" stroke-opacity="0.7"/>
    <text x="600" y="561" text-anchor="middle" font-size="13" font-weight="600" fill="#bbf7d0">A 100 Gbps attack can knock most unprotected data centers offline (Cloudflare, H1 2026)</text>
  </g>
</svg>
